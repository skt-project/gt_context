name: context-health

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate context
        shell: pwsh
        run: ./scripts/validate-context.ps1
      - name: Scan secrets
        shell: pwsh
        run: ./scripts/scan-secrets.ps1
      - name: Check generated digest
        shell: pwsh
        run: ./scripts/generate-ai-context.ps1 -Check

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.18.1

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "**/*.md"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
